apiVersion: apps/v1
kind: Deployment
metadata:
  name: saldes-api
  labels:
    app: saldes-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: saldes-api
  template:
    metadata:
      labels:
        app: saldes-api
    spec:
      containers:
        - name: saldes-api
          image: ghcr.io/pytt156/churn-mlops-pipeline-daniela-api:d2acfa7ed622b5d599ae6f353f5dc4491424c547
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
